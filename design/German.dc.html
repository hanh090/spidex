<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,700;1,400&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
    body { margin: 0; font-family: Archivo, "Helvetica Neue", sans-serif; }
    a { color: #b8232c; } a:hover { color: #8c1a21; }
    .meta { font: 600 10px/1 Archivo, sans-serif; letter-spacing: .15em; text-transform: uppercase; }
    .chip { height: 48px; padding: 0 13px; display: flex; align-items: center; justify-content: center; font: 500 12px/1 Archivo, sans-serif; background: #faf7f2; color: #3c352d; border: 1px solid #cfc6b6; white-space: nowrap; }
    .chipOn { height: 48px; padding: 0 13px; display: flex; align-items: center; justify-content: center; font: 600 12px/1 Archivo, sans-serif; background: #b8232c; color: #faf7f2; border: 1px solid #b8232c; white-space: nowrap; }
    .sw { width: 48px; height: 48px; border: 1px solid #cfc6b6; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #faf7f2; display: flex; flex-direction: column; overflow: hidden; color: #141110;">

  <div style="height: 52px; flex-shrink: 0; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #ddd5c8; background: #f0ebe1; gap: 8px;">
    <div style="display: flex; align-items: center; gap: 8px; min-width: 0;">
      <svg width="18" height="18" viewBox="0 0 64 64" style="flex-shrink: 0;">
        <path d="M32 58 C32 34 44 12 60 6 C60 30 50 50 32 58 Z" fill="#b8232c"/>
        <path d="M32 58 C32 34 20 12 4 6 C4 30 14 50 32 58 Z" fill="#141110"/>
      </svg>
      <span style="font: 600 14px/1.15 Archivo, sans-serif; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Schmetterlinge Vietnams</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6b6258" stroke-width="2.4" style="flex-shrink: 0;"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 5px; flex-shrink: 0;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#b47818" stroke-width="2"><path d="M2 8a15 15 0 0120 0"/><circle cx="12" cy="18" r="1.4" fill="#b47818" stroke="none"/><path d="M3 3l18 18" stroke-width="2.2"/></svg>
      <span class="meta" style="color: #b47818;">Offline</span>
    </div>
  </div>

  <div style="height: 68px; flex-shrink: 0; padding: 10px 16px; box-sizing: border-box;">
    <div style="height: 48px; border: 1px solid #cfc6b6; background: #fff; display: flex; align-items: center; gap: 9px; padding: 0 12px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b6258" stroke-width="2.2" style="flex-shrink: 0;"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
      <span style="font: 400 14px/1 Archivo, sans-serif; color: #8b8175; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Name oder wissenschaftlicher Name…</span>
    </div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 0 16px;">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <div style="aspect-ratio: 1; background: #efe9dd; border: 1px solid #ddd5c8; display: flex; align-items: center; justify-content: center;">
          <svg width="62" height="62" viewBox="0 0 64 64"><path d="M32 52 C32 32 42 14 57 9 C57 29 47 46 32 52 Z" fill="#d4a017"/><path d="M32 52 C32 32 22 14 7 9 C7 29 17 46 32 52 Z" fill="#141110"/></svg>
        </div>
        <div style="font: 600 11px/1.25 Archivo, sans-serif;">Helenafalter</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <div style="aspect-ratio: 1; background: #f2ecdf; border: 1px solid #ddd5c8; display: flex; align-items: center; justify-content: center;">
          <svg width="62" height="62" viewBox="0 0 64 64"><path d="M32 52 C32 32 42 14 57 9 C57 29 47 46 32 52 Z" fill="#e0ae1f"/><path d="M32 52 C32 32 22 14 7 9 C7 29 17 46 32 52 Z" fill="#2a2118"/></svg>
        </div>
        <div style="font: 600 11px/1.25 Archivo, sans-serif;">Goldener Vogelflügler</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <div style="aspect-ratio: 1; background: #eee8dc; border: 1px solid #ddd5c8; display: flex; align-items: center; justify-content: center;">
          <svg width="62" height="62" viewBox="0 0 64 64"><path d="M32 52 C32 32 42 14 57 9 C57 29 47 46 32 52 Z" fill="#f2ece2"/><path d="M32 52 C32 32 22 14 7 9 C7 29 17 46 32 52 Z" fill="#1b1713"/></svg>
        </div>
        <div style="font: 600 11px/1.25 Archivo, sans-serif;">Mormonenfalter</div>
      </div>
    </div>
  </div>

  <!-- filter sheet, German -->
  <div style="flex-shrink: 0; background: #f0ebe1; border-top: 1px solid #cfc6b6;">
    <div style="display: flex; justify-content: center; padding: 7px 0 3px;">
      <div style="width: 40px; height: 4px; background: #cfc6b6;"></div>
    </div>

    <div style="padding: 4px 16px 14px; display: flex; flex-direction: column; gap: 10px;">

      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap;">
        <div style="font: 700 15px/1.15 Spectral, Georgia, serif;">
          <span style="color: #b8232c;">47</span> Arten passen
        </div>
        <div class="meta" style="color: #6b6258; text-decoration: underline; text-underline-offset: 3px; text-align: right; min-height: 48px; display: flex; align-items: center; padding: 0 4px; margin: -12px -4px;">Alle zurücksetzen</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 5px;">
        <div class="meta" style="color: #6b6258;">Größe</div>
        <div style="display: flex; gap: 6px; flex-wrap: wrap;">
          <div class="chip">Winzig</div>
          <div class="chipOn">Klein</div>
          <div class="chip">Mittel</div>
          <div class="chip">Groß</div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 5px;">
        <div class="meta" style="color: #6b6258;">Hauptfarbe</div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <div class="sw" style="background: #1b1713;"></div>
          <div class="sw" style="background: #f6f2ea;"></div>
          <div class="sw" style="background: #d4a017; border: 2px solid #b8232c; outline: 1px solid #f0ebe1; outline-offset: -4px;"></div>
          <div class="sw" style="background: #cf7a1e;"></div>
          <div class="sw" style="background: #b8232c;"></div>
          <div class="sw" style="background: #4a7c4e;"></div>
          <div class="sw" style="background: #2f5fa8;"></div>
          <div class="sw" style="background: #9a958c;"></div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 5px;">
        <div class="meta" style="color: #6b6258;">Zeichnung</div>
        <div style="display: flex; gap: 6px; flex-wrap: wrap;">
          <div class="chip">Punkte</div>
          <div class="chip">Binden</div>
          <div class="chip">Augenflecken</div>
          <div class="chip">Einfarbig</div>
        </div>
      </div>

    </div>
  </div>

  <div style="height: 62px; flex-shrink: 0; background: #faf7f2; border-top: 1px solid #cfc6b6; display: flex;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-top: 2px solid #b8232c; margin-top: -1px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141110" stroke-width="1.9"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <span style="font: 600 9px/1 Archivo, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #141110;">Entdecken</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b6258" stroke-width="1.9"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/><path d="M11 8v3l2 1.5"/></svg>
      <span style="font: 600 9px/1 Archivo, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #6b6258;">Bestimmen</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b6258" stroke-width="1.9"><path d="M5 3h14v18l-7-4-7 4z"/><path d="M9 8h6"/></svg>
      <span style="font: 600 9px/1 Archivo, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #6b6258;">Notizen</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b6258" stroke-width="1.9"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>
      <span style="font: 600 9px/1 Archivo, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #6b6258;">Mehr</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
