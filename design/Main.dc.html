<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,700;1,400&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
    body { margin: 0; font-family: Archivo, "Helvetica Neue", sans-serif; }
    a { color: #b8232c; } a:hover { color: #8c1a21; }
    .meta { font: 600 10px/1 Archivo, sans-serif; letter-spacing: .15em; text-transform: uppercase; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #faf7f2; display: flex; flex-direction: column; overflow: hidden; color: #141110;">

  <!-- header: pack chip + connectivity -->
  <div style="height: 52px; flex-shrink: 0; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #ddd5c8; background: #f0ebe1;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <svg width="18" height="18" viewBox="0 0 64 64">
        <path d="M32 58 C32 34 44 12 60 6 C60 30 50 50 32 58 Z" fill="{{accent}}"/>
        <path d="M32 58 C32 34 20 12 4 6 C4 30 14 50 32 58 Z" fill="#141110"/>
      </svg>
      <span style="font: 600 14px/1 Archivo, sans-serif;">Butterflies of VN</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6b6258" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 5px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b6258" stroke-width="2"><path d="M2 8a15 15 0 0120 0"/><path d="M5 12a10 10 0 0114 0"/><circle cx="12" cy="18" r="1.4" fill="#6b6258" stroke="none"/><path d="M3 3l18 18" stroke="#b47818" stroke-width="2.2"/></svg>
      <span class="meta" style="color: #b47818;">Offline</span>
    </div>
  </div>

  <!-- search -->
  <div style="height: 68px; flex-shrink: 0; padding: 10px 16px; box-sizing: border-box;">
    <div style="height: 48px; border: 1px solid #cfc6b6; background: #fff; display: flex; align-items: center; gap: 9px; padding: 0 12px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b6258" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
      <span style="font: 400 15px/1 Archivo, sans-serif; color: #8b8175;">Name or scientific name…</span>
    </div>
  </div>

  <!-- results grid -->
  <div style="flex-grow: 1; overflow: hidden; padding: 0 16px;">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
      <sc-for list="{{results}}" as="sp" hint-placeholder-count="6">
        <div style="display: flex; flex-direction: column; gap: 5px;">
          <div style="aspect-ratio: 1; background: {{sp.bg}}; border: 1px solid #ddd5c8; display: flex; align-items: center; justify-content: center;">
            <svg width="62" height="62" viewBox="0 0 64 64">
              <path d="M32 52 C32 32 42 14 57 9 C57 29 47 46 32 52 Z" fill="{{sp.c1}}"/>
              <path d="M32 52 C32 32 22 14 7 9 C7 29 17 46 32 52 Z" fill="{{sp.c2}}"/>
              <path d="M31 14 h2 v38 h-2 Z" fill="#141110" opacity=".8"/>
            </svg>
          </div>
          <div style="font: 600 11px/1.25 Archivo, sans-serif; color: #141110;">{{sp.name}}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- filter sheet -->
  <div style="flex-shrink: 0; background: #f0ebe1; border-top: 1px solid #cfc6b6;">
    <div style="display: flex; justify-content: center; padding: 7px 0 3px;">
      <div style="width: 40px; height: 4px; background: #cfc6b6;"></div>
    </div>

    <div style="padding: 4px 16px 14px; display: flex; flex-direction: column; gap: 11px;">

      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <div style="font: 700 15px/1 Spectral, Georgia, serif;">
          <span style="color: {{accent}};">{{count}}</span> species match
        </div>
        <div class="meta" style="color: #6b6258; text-decoration: underline; text-underline-offset: 3px; min-height: 48px; display: flex; align-items: center; padding: 0 4px; margin: -12px -4px;">Clear all</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 5px;">
        <div class="meta" style="color: #6b6258;">Size</div>
        <div style="display: flex; gap: 6px; flex-wrap: wrap;">
          <sc-for list="{{sizes}}" as="o" hint-placeholder-count="4">
            <div onClick="{{o.pick}}" style="{{o.css}}">{{o.label}}</div>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 5px;">
        <div class="meta" style="color: #6b6258;">Main colour</div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <sc-for list="{{swatches}}" as="s" hint-placeholder-count="8">
            <div onClick="{{s.pick}}" style="{{s.css}}"></div>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 5px;">
        <div class="meta" style="color: #6b6258;">Pattern</div>
        <div style="display: flex; gap: 6px; flex-wrap: wrap;">
          <sc-for list="{{patterns}}" as="p" hint-placeholder-count="4">
            <div onClick="{{p.pick}}" style="{{p.css}}">{{p.label}}</div>
          </sc-for>
        </div>
      </div>

    </div>
  </div>

  <!-- tab bar -->
  <div style="height: 62px; flex-shrink: 0; background: #faf7f2; border-top: 1px solid #cfc6b6; display: flex;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-top: 2px solid {{accent}}; margin-top: -1px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#141110" stroke-width="1.9"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <span class="meta" style="color: #141110;">Explore</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6b6258" stroke-width="1.9"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/><path d="M11 8v3l2 1.5"/></svg>
      <span class="meta" style="color: #6b6258;">Identify</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6b6258" stroke-width="1.9"><path d="M5 3h14v18l-7-4-7 4z"/><path d="M9 8h6"/></svg>
      <span class="meta" style="color: #6b6258;">Log</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6b6258" stroke-width="1.9"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>
      <span class="meta" style="color: #6b6258;">More</span>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#b8232c","options":["#b8232c","#1f5f4b","#8c4a12","#2b3a67"]}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { size: null, colours: [], patterns: [] };
  }

  species() {
    return [
      { name: 'Common Birdwing',  size: 'large', colours: ['black','gold'],  pattern: 'bands',    c1: '#d4a017', c2: '#141110', bg: '#efe9dd' },
      { name: 'Golden Birdwing',  size: 'large', colours: ['gold','black'],  pattern: 'bands',    c1: '#e0ae1f', c2: '#2a2118', bg: '#f2ecdf' },
      { name: 'Common Mormon',    size: 'med',   colours: ['black','white'], pattern: 'spots',    c1: '#f2ece2', c2: '#1b1713', bg: '#eee8dc' },
      { name: 'Lime Butterfly',   size: 'med',   colours: ['black','cream'], pattern: 'spots',    c1: '#e3d7a8', c2: '#241f18', bg: '#f1ebdd' },
      { name: 'Blue Pansy',       size: 'small', colours: ['blue','orange'], pattern: 'eyespots', c1: '#2f5fa8', c2: '#c8721c', bg: '#e9ecf1' },
      { name: 'Peacock Pansy',    size: 'small', colours: ['orange'],        pattern: 'eyespots', c1: '#cf8a1e', c2: '#a3611a', bg: '#f2ebdb' },
      { name: 'Grey Pansy',       size: 'small', colours: ['grey'],          pattern: 'bands',    c1: '#9a958c', c2: '#7a746b', bg: '#eeeae4' },
      { name: 'Striped Albatross',size: 'med',   colours: ['white','black'], pattern: 'bands',    c1: '#f4efe6', c2: '#2b251d', bg: '#f0ebe1' },
      { name: 'Great Orange Tip', size: 'med',   colours: ['orange','white'],pattern: 'plain',    c1: '#d4701c', c2: '#f4efe6', bg: '#f3ead9' },
      { name: 'Tailed Jay',       size: 'med',   colours: ['green','black'], pattern: 'spots',    c1: '#4a7c4e', c2: '#1c1a15', bg: '#e9eee7' },
      { name: 'Common Rose',      size: 'large', colours: ['black','red'],   pattern: 'bands',    c1: '#b8232c', c2: '#171310', bg: '#f1e6e2' },
      { name: 'Grass Yellow',     size: 'tiny',  colours: ['gold'],          pattern: 'plain',    c1: '#e2c22b', c2: '#c9a91f', bg: '#f4f0dc' }
    ];
  }

  chipCss(on, accent) {
    return on
      ? 'height:48px;min-width:56px;padding:0 14px;display:flex;align-items:center;justify-content:center;'
        + 'font:600 12px/1 Archivo,sans-serif;background:' + accent + ';color:#faf7f2;border:1px solid ' + accent + ';cursor:pointer;'
      : 'height:48px;min-width:56px;padding:0 14px;display:flex;align-items:center;justify-content:center;'
        + 'font:500 12px/1 Archivo,sans-serif;background:#faf7f2;color:#3c352d;border:1px solid #cfc6b6;cursor:pointer;';
  }

  swatchCss(on, hex, accent) {
    return 'width:48px;height:48px;background:' + hex + ';cursor:pointer;'
      + (on ? 'border:2px solid ' + accent + ';outline:1px solid #faf7f2;outline-offset:-4px;'
            : 'border:1px solid #cfc6b6;');
  }

  toggle(key, v) {
    const cur = this.state[key];
    this.setState({ [key]: cur.includes(v) ? cur.filter((x) => x !== v) : cur.concat([v]) });
  }

  renderVals() {
    const accent = this.props.accent ?? '#b8232c';
    const st = this.state;
    const all = this.species();

    const results = all.filter((s) =>
      (!st.size || s.size === st.size) &&
      (st.colours.length === 0 || st.colours.some((c) => s.colours.includes(c))) &&
      (st.patterns.length === 0 || st.patterns.includes(s.pattern))
    );

    const sizes = [
      { v: 'tiny', label: 'Tiny' }, { v: 'small', label: 'Small' },
      { v: 'med', label: 'Medium' }, { v: 'large', label: 'Large' }
    ].map((o) => ({
      label: o.label,
      css: this.chipCss(st.size === o.v, accent),
      pick: () => this.setState({ size: st.size === o.v ? null : o.v })
    }));

    const swatches = [
      { v: 'black', hex: '#1b1713' }, { v: 'white', hex: '#f6f2ea' }, { v: 'gold', hex: '#d4a017' },
      { v: 'orange', hex: '#cf7a1e' }, { v: 'red', hex: '#b8232c' }, { v: 'green', hex: '#4a7c4e' },
      { v: 'blue', hex: '#2f5fa8' }, { v: 'grey', hex: '#9a958c' }
    ].map((s) => ({
      css: this.swatchCss(st.colours.includes(s.v), s.hex, accent),
      pick: () => this.toggle('colours', s.v)
    }));

    const patterns = [
      { v: 'spots', label: 'Spots' }, { v: 'bands', label: 'Bands' },
      { v: 'eyespots', label: 'Eyespots' }, { v: 'plain', label: 'Plain' }
    ].map((p) => ({
      label: p.label,
      css: this.chipCss(st.patterns.includes(p.v), accent),
      pick: () => this.toggle('patterns', p.v)
    }));

    return { accent, results: results.slice(0, 6), count: results.length, sizes, swatches, patterns };
  }
}
</script>
</body>
</html>
