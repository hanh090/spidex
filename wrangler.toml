name = "spidex"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-23"

# Admin resource store. Create once:
#   wrangler d1 create spidex-admin
# then paste the returned database_id below and run the migration:
#   wrangler d1 execute spidex-admin --file=migrations/0001_admin.sql
# (add --remote for the deployed database)
[[d1_databases]]
binding = "DB"
database_name = "spidex-admin"
database_id = "ffb145fd-0807-461f-b262-caa5ba1c4b7b"

# Community pack storage. R2 must be enabled on the account once (dashboard),
# then create the bucket and uncomment the binding:
#   wrangler r2 bucket create spidex-packs
# Key layout: submissions/<submissionId>/<path> (staging, never served).
# Approving a pack writes a D1 row (kind='pack', meta.community=true,
# meta.prefix=<that staging prefix>) and /packs/* serves through it, so
# approval is a row write — no mass copy. Packs approved before staging
# existed have no meta.prefix and serve from packs/<packId>/.
# [[r2_buckets]]
# binding = "PACKS"
# bucket_name = "spidex-packs"
