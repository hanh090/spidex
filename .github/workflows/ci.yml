name: CI

on:
  push:
    branches: [master]
  pull_request:

# No deploy job: pack photography is kept out of git, so a build from this
# checkout would ship packs without images. Deploys run from a working tree
# that has the media (see README, Deploy).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
